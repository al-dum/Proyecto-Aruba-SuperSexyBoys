[project]
name = "energy-dispatch"
version = "0.1.0"
description = "Sistema de Predicción y Despacho Energético mediante Machine Learning"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
